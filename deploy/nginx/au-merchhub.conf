# Add these locations inside the existing HTTPS server block. They do not
# replace or modify the existing /content or /api locations.
location = /merchhub {
    return 308 /merchhub/;
}

location /merchhub/ {
    alias /var/www/au-merchhub/;
    try_files $uri $uri/ /merchhub/index.html;
}

location = /merchhub-api {
    return 308 /merchhub-api/;
}

location /merchhub-api/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 100k;
}
